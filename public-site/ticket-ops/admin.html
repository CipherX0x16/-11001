<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>TICKET OPS 管理员后台登录</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#ecf6ff;background:#071225;min-height:100vh;overflow-x:hidden}button,input,select{font:inherit}body:before,body:after{content:"";position:fixed;width:65vw;height:65vw;border-radius:50%;filter:blur(80px);opacity:.42;animation:float 12s ease-in-out infinite alternate;z-index:-2}body:before{background:#176dff;left:-20%;top:-25%}body:after{background:#00b7ff;right:-25%;bottom:-35%;animation-delay:-5s}@keyframes float{to{transform:translate(9vw,7vh) scale(1.12)}}.mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 70% 15%,#8fd8ff26,transparent 28%),linear-gradient(120deg,#0a1833aa,#173b70aa);overflow:hidden}.wave{position:absolute;width:120%;height:35%;left:-10%;bottom:5%;background:linear-gradient(90deg,transparent,#35a9ff30,#c2ecff25,transparent);filter:blur(24px);transform:rotate(-8deg);animation:wave 9s ease-in-out infinite alternate}@keyframes wave{to{transform:translateY(-22vh) rotate(5deg)}}.glass{background:linear-gradient(145deg,#ffffff25,#ffffff0c);border:1px solid #ffffff38;box-shadow:inset 0 1px 1px #ffffff70,0 24px 70px #00143d60;backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);border-radius:26px}.brand{display:flex;gap:12px;align-items:center;font-weight:700}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#c6edff,#208cff);box-shadow:inset 0 1px #fff,0 8px 22px #1686ff80}.label{color:#9fb5cf;font-size:14px}.role{font-size:12px;color:#91d9ff}.btn{border:1px solid #a9dcff70;color:white;background:linear-gradient(145deg,#69c8ff90,#1671eaaa);padding:12px 18px;border-radius:16px;box-shadow:inset 0 1px #fff8,0 10px 24px #087dfb45;cursor:pointer}.btn:active{transform:scale(.98)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);padding:34px}.loginbox h1{margin:24px 0 6px}.back{display:inline-block;margin-bottom:18px;color:#9fd9ff;text-decoration:none;font-size:14px}.loginbox input{width:100%;padding:14px 16px;margin:7px 0 12px;color:#fff;background:#ffffff12;border:1px solid #ffffff30;border-radius:15px;outline:none}.loginbox input:focus{border-color:#8fd2ff;box-shadow:0 0 0 4px #2196f322}.loginbox .btn{width:100%;margin-top:10px}.error{min-height:21px;color:#ff9db1;font-size:13px}.secure{display:flex;align-items:center;gap:8px;margin-top:18px;color:#8ea9c6;font-size:12px}.secure:before{content:"";width:7px;height:7px;border-radius:50%;background:#58ffc0;box-shadow:0 0 12px #58ffc0}</style></head><body><div class="mesh"><div class="wave"></div></div><main class="login"><section class="loginbox glass"><a class="back" href="index.html">← 返回入口选择</a><div class="brand"><div class="logo"></div><div>TICKET OPS<br><small class="role">ADMIN CONSOLE</small></div></div><h1>管理员后台登录</h1><p class="label">仅限系统管理员进入</p><form id="loginForm"><input id="username" name="username" autocomplete="username" placeholder="账号" required><input id="password" name="password" type="password" autocomplete="current-password" placeholder="密码" required><div class="error" id="error" aria-live="polite"></div><button class="btn" id="submit" type="submit">安全登录</button></form><div class="secure">此入口通过服务端独立验证</div></section></main><script>
const form=document.getElementById('loginForm'),error=document.getElementById('error'),submit=document.getElementById('submit');
const expectedUser="lt620621",expectedPasswordHash="b5cc01b8040cda7f75191f4dd441837d65ec91e11ea0e93f3a35aa02c44793f7";
async function digest(value){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return [...new Uint8Array(bytes)].map(byte=>byte.toString(16).padStart(2,'0')).join('')}
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='验证中…';const valid=form.username.value.trim()===expectedUser&&await digest(form.password.value)===expectedPasswordHash;if(valid){sessionStorage.setItem('ticket-ops-admin','1');location.replace('admin-app.html');return}error.textContent='账号或密码错误，请重新输入';submit.disabled=false;submit.textContent='安全登录'});
document.getElementById('username').focus();
</script></body></html>
