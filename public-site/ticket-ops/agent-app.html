<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>TICKET OPS 节点调度</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#ecf6ff;background:#071225;min-height:100vh;overflow-x:hidden}button,input,select{font:inherit}body:before,body:after{content:"";position:fixed;width:65vw;height:65vw;border-radius:50%;filter:blur(80px);opacity:.42;animation:float 12s ease-in-out infinite alternate;z-index:-2}body:before{background:#176dff;left:-20%;top:-25%}body:after{background:#00b7ff;right:-25%;bottom:-35%;animation-delay:-5s}@keyframes float{to{transform:translate(9vw,7vh) scale(1.12)}}.mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 70% 15%,#8fd8ff26,transparent 28%),linear-gradient(120deg,#0a1833aa,#173b70aa);overflow:hidden}.wave{position:absolute;width:120%;height:35%;left:-10%;bottom:5%;background:linear-gradient(90deg,transparent,#35a9ff30,#c2ecff25,transparent);filter:blur(24px);transform:rotate(-8deg);animation:wave 9s ease-in-out infinite alternate}@keyframes wave{to{transform:translateY(-22vh) rotate(5deg)}}.glass{background:linear-gradient(145deg,#ffffff25,#ffffff0c);border:1px solid #ffffff38;box-shadow:inset 0 1px 1px #ffffff70,0 24px 70px #00143d60;backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);border-radius:26px}.brand{display:flex;gap:12px;align-items:center;font-weight:700}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#c6edff,#208cff);box-shadow:inset 0 1px #fff,0 8px 22px #1686ff80}.label{color:#9fb5cf;font-size:14px}.role{font-size:12px;color:#91d9ff}.btn{border:1px solid #a9dcff70;color:white;background:linear-gradient(145deg,#69c8ff90,#1671eaaa);padding:12px 18px;border-radius:16px;box-shadow:inset 0 1px #fff8,0 10px 24px #087dfb45;cursor:pointer}.btn:active{transform:scale(.98)}

x;margin-top:9px}.machine-list{display:grid;gap:9px}.machine-mini{display:flex;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff18}.machine-mini span{color:#8faac7;font-size:13px}.notice{padding:13px 14px;margin-bottom:14px;border-radius:15px;background:#58b8ff12;border:1px solid #83d0ff2d;color:#aac9e5;font-size:13px;line-height:1.6}.modal-wrap{position:fixed;inset:0;z-index:12;display:none;place-items:center;padding:18px;background:#020b18b8;backdrop-filter:blur(16px)}.modal-wrap.open{display:grid}.mapping-modal{width:min(760px,100%);max-height:82vh;padding:24px;overflow:auto}.modal-head{display:flex;align-items:start;justify-content:space-between;gap:20px}.modal-head h2{margin:0 0 6px}.mapping-table{width:100%;border-collapse:collapse;margin-top:16px}.mapping-table th,.mapping-table td{padding:13px 9px;text-align:left;border-bottom:1px solid #ffffff16}.mapping-table th{color:#8faac7;font-size:13px}.ready{color:#63ffc0}.count-badge{display:inline-flex;padding:7px 10px;border-radius:99px;background:#55baff22;color:#a6ddff;font-size:13px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.settings-form{display:grid;gap:14px}.settings-form label{display:grid;gap:7px;color:#9fb5cf;font-size:14px}.field option{color:#10233b}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid #ffffff16}.setting-row:last-child{border-bottom:0}.setting-row b{display:block;margin-bottom:5px}.switch{width:48px;height:27px;border:0;border-radius:99px;background:#ffffff25;padding:3px;cursor:pointer;transition:.2s}.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:#d8eaff;transition:.2s}.switch.on{background:#299cff}.switch.on:after{transform:translateX(21px);background:white}.metric-list{display:grid;gap:14px}.metric-line{display:grid;grid-template-columns:120px 1fr 58px;gap:12px;align-items:center}.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#277cff,#5ed8ff)}.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.health{padding:16px;border-radius:18px;background:#ffffff0b;border:1px solid #ffffff1c}.health b{display:block;margin-bottom:7px}.health span{font-size:13px;color:#66ffc2}.account-id{padding:13px 14px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff1c;color:#b9cee2}@media(max-width:900px){header{margin:10px;height:68px}.shell{grid-template-columns:1fr;padding:0 10px}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}.content,.account-layout,.settings-grid{grid-template-columns:1fr}.cities{grid-template-columns:repeat(2,1fr)}.toolbar{overflow:auto;flex-wrap:nowrap;padding-bottom:4px}.tab{white-space:nowrap}}@media(max-width:620px){.health-grid{grid-template-columns:1fr}.metric-line{grid-template-columns:90px 1fr 48px}}@media(max-width:520px){.status{display:none}.stats{grid-template-columns:1fr 1fr}.card{padding:15px}.num{font-size:22px}.drawer{width:calc(100% - 20px);right:10px}.top{align-items:center}.top h1{font-size:23px}.brand small{font-size:10px}.account-row{grid-template-columns:1fr 42px}.account-row .damai-password{grid-column:1/2}.mapping-table{font-size:13px}}
</style></head><body><div class="mesh"><div class="wave"></div></div><header class="glass"><div class="brand"><div class="logo"></div><div>TICKET OPS<br><small style="color:#8ea9c6;font-weight:500">NODE CONTROL</small></div></div><div style="display:flex;align-items:center;gap:12px"><div class="status"><span class="dot"></span>API 调度服务运行中 · 264ms</div><span class="role">代理 · zf77740</span><button class="logout" id="logout">退出</button></div></header><div class="shell"><aside class="side glass" id="side"></aside><main class="main"><div class="toolbar" id="tabs"></div><div id="views"></div></main></div><div class="drawer glass" id="drawer"><button class="close" id="closeDrawer">×</button><h2>分配节点</h2><p class="label">为代理设置可用城市与节点数量</p><label>代理账户</label><select><option>zf77740 · 默认代理</option><option>agent_021 · 华东一组</option></select><label>节点城市</label><select id="citySelect"></select><label>分配数量</label><input type="number" min="1" value="5"><button class="btn" style="width:100%" id="save">确认分配</button></div><div class="toast glass" id="toast">操作已完成</div><div class="modal-wrap" id="mappingModal" role="dialog" aria-modal="true" aria-labelledby="mappingTitle"><section class="mapping-modal glass"><div class="modal-head"><div><h2 id="mappingTitle">云机账号映射</h2><p class="label" id="mappingSummary"></p></div><button class="close" id="closeMapping" aria-label="关闭">×</button></div><div class="notice">账号已完成云机映射；密码不会在结果中显示或保存。</div><div style="overflow:auto"><table class="mapping-table"><thead><tr><th>云机</th><th>节点区域</th><th>大麦账号</th><th>状态</th></tr></thead><tbody id="mappingRows"></tbody></table></div></section></div><script>
const currentRole="agent",pageNames=["我的节点","大麦账号分发","抢票任务","运行记录","账户设置"],cityData=[['北京',30,24],['广州',30,26],['上海',30,21],['深圳',30,27],['杭州',80,69],['成都',30,25],['重庆',40,31],['其他省份',17,13]],agents=[['默认代理',"zf77740",'20 个节点'],['华东一组','agent_021','32 个节点'],['星海票务','agent_016','18 个节点'],['快捷通道','agent_009','12 个节点']];
const side=document.getElementById('side'),tabs=document.getElementById('tabs'),views=document.getElementById('views'),drawer=document.getElementById('drawer'),toast=document.getElementById('toast');
function stats(items){return '<section class="stats">'+items.map(x=>'<div class="card glass"><div class="label">'+x[0]+'</div><div class="num">'+x[1]+'</div><div class="sub">'+x[2]+'</div></div>').join('')+'</section>'}
function overview(){return '<div class="top"><div><h1>IP 节点调度中心</h1><p>城市库存、代理额度与任务占用实时概览</p></div><button class="btn" id="allocate">＋ 分配节点</button></div>'+stats([['节点总量','287','● 241 可用'],['已分配','126','43.9% 使用率'],['活跃任务','18','● 状态正常'],['代理账户','32','今日 +3']])+'<section class="content"><div class="panel glass"><h2>核心城市节点池</h2><div class="cities">'+cityData.map(x=>'<button class="city"><b>'+x[0]+'</b><span>可用 '+x[2]+' / '+x[1]+'</span></button>').join('')+'</div></div><div class="panel glass"><h2>代理节点配额</h2>'+agents.map((x,i)=>'<div class="agent"><div class="who"><div class="avatar">'+(i+1)+'</div><div><b>'+x[0]+'</b><div class="label">'+x[1]+'</div></div></div><span class="pill">'+x[2]+'</span></div>').join('')+'</div></section>'}
function generic(title,sub,rows){return '<div class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(currentRole==='admin'?'<button class="btn create">＋ 新建</button>':'')+'</div><div class="panel glass"><table class="table"><thead><tr><th>名称</th><th>状态</th><th>数量 / 时间</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td><span class="pill">'+r[1]+'</span></td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table></div>'}
function distributionPage(){return '<div class="top"><div><h1>大麦账号分发</h1><p>录入账号后自动建立一对一云机映射</p></div><span class="count-badge">20 台云机在线</span></div><div class="account-layout"><section class="panel glass"><h2>账号与密码</h2><div class="notice">每个账号分配一台独立云机；最多一次录入 20 个。当前先建立映射，接入云机厂商 API 后执行真实下发。</div><div id="accountRows"><div class="account-row"><input class="damai-account" autocomplete="off" placeholder="大麦账号 / 手机号"><input class="damai-password" type="password" autocomplete="new-password" placeholder="大麦密码"><button class="remove-row" type="button" aria-label="删除此账号">×</button></div></div><div class="form-error" id="distributionError" aria-live="polite"></div><div class="account-actions"><button class="ghost" id="addAccountRow" type="button">＋ 添加账号</button><button class="btn" id="distributeAccounts" type="button">自动分配至云机</button></div></section><aside class="panel glass"><h2>云机池</h2><div class="machine-list">'+[['CM-001','北京'],['CM-002','上海'],['CM-003','杭州'],['CM-004','广州'],['CM-005','深圳']].map(x=>'<div class="machine-mini"><b>'+x[0]+'</b><span>'+x[1]+' · 在线</span></div>').join('')+'<div class="label" style="padding:8px 4px">另有 15 台云机在线待分配</div></div></aside></div>'}
function monitoringPage(){return '<div class="top"><div><h1>运行监控</h1><p>节点、任务与调度服务实时健康状态</p></div><button class="btn" id="refreshMonitor">刷新状态</button></div>'+stats([['API 成功率','99.82%','● 运行稳定'],['平均延迟','264ms','较昨日 -21ms'],['在线节点','241','83.9% 在线'],['异常告警','2','待处理']])+'<div class="content"><section class="panel glass"><h2>区域节点负载</h2><div class="metric-list">'+[['北京',68],['上海',74],['杭州',52],['广州',61],['深圳',57],['成都',46]].map(x=>'<div class="metric-line"><span>'+x[0]+'</span><div class="bar"><i style="width:'+x[1]+'%"></i></div><b>'+x[1]+'%</b></div>').join('')+'</div></section><section class="panel glass"><h2>服务健康</h2><div class="health-grid"><div class="health"><b>调度 API</b><span>● 正常</span></div><div class="health"><b>任务队列</b><span>● 正常</span></div><div class="health"><b>节点心跳</b><span>● 正常</span></div></div><div class="notice" style="margin-top:16px">最后同步：刚刚 · 自动刷新间隔 30 秒</div></section></div>'}
function systemSettingsPage(){return '<div class="top"><div><h1>系统设置</h1><p>调度规则、告警与安全策略</p></div><button class="btn save-settings">保存设置</button></div><div class="settings-grid"><section class="panel glass"><h2>调度参数</h2><div class="settings-form"><label>默认并发上限<input class="field" type="number" min="1" max="100" value="20"></label><label>节点超时时间<select class="field"><option>8 秒</option><option selected>12 秒</option><option>20 秒</option></select></label><label>失败重试次数<select class="field"><option>1 次</option><option selected>3 次</option><option>5 次</option></select></label></div></section><section class="panel glass"><h2>运行策略</h2><div class="setting-row"><div><b>自动切换故障节点</b><span class="label">异常时切换到同区域可用节点</span></div><button class="switch on" role="switch" aria-checked="true"></button></div><div class="setting-row"><div><b>任务异常告警</b><span class="label">连续失败时发送系统通知</span></div><button class="switch on" role="switch" aria-checked="true"></button></div><div class="setting-row"><div><b>低库存保护</b><span class="label">可用节点低于 10% 时暂停分配</span></div><button class="switch" role="switch" aria-checked="false"></button></div></section></div>'}
function accountSettingsPage(){return '<div class="top"><div><h1>账户设置</h1><p>管理代理资料与操作偏好</p></div><button class="btn save-account">保存设置</button></div><div class="settings-grid"><section class="panel glass"><h2>账户信息</h2><div class="settings-form"><label>登录账号<div class="account-id">'+"zf77740"+'</div></label><label>联系人姓名<input class="field" id="contactName" autocomplete="name" placeholder="请输入联系人姓名"></label><label>通知手机号<input class="field" id="notifyPhone" inputmode="tel" autocomplete="tel" placeholder="请输入通知手机号"></label></div></section><section class="panel glass"><h2>通知与安全</h2><div class="setting-row"><div><b>任务状态提醒</b><span class="label">任务开始、成功或失败时提醒</span></div><button class="switch on" role="switch" aria-checked="true"></button></div><div class="setting-row"><div><b>节点额度预警</b><span class="label">剩余节点不足时提醒</span></div><button class="switch on" role="switch" aria-checked="true"></button></div><div class="setting-row"><div><b>保持登录状态</b><span class="label">当前设备保持 12 小时登录</span></div><button class="switch" role="switch" aria-checked="false"></button></div></section></div>'}
function pageHtml(name){if(name==='节点总览')return overview();if(name==='代理管理')return generic(name,'代理账号、额度与节点使用情况',agents.map(x=>[x[0]+' · '+x[1],'启用',x[2]]));if(name==='任务调度'||name==='抢票任务')return generic(name,'创建任务并选择城市节点与并发数量',[['周杰伦演唱会','运行中','8 节点'],['体育赛事预售','等待中','5 节点'],['音乐节早鸟票','已完成','12 节点']]);if(name==='我的节点')return '<div class="top"><div><h1>我的节点</h1><p>选择并调用已分配的城市节点</p></div></div>'+stats([['节点额度','20','● 18 可用'],['运行任务','2','状态正常'],['今日请求','1,286','成功率 98.7%'],['平均延迟','238ms','较昨日 -18ms']])+'<div class="panel glass" style="margin-top:16px"><h2>可用城市</h2><div class="cities">'+cityData.slice(0,5).map((x,i)=>'<button class="city"><b>'+x[0]+'</b><span>我的额度 '+[4,3,4,3,6][i]+' 个</span></button>').join('')+'</div></div>';if(name==='大麦账号分发')return distributionPage();if(name==='运行监控')return monitoringPage();if(name==='系统设置')return systemSettingsPage();if(name==='账户设置')return accountSettingsPage();return generic(name,'功能配置与状态概览',[['默认配置','正常','刚刚更新'],['访问权限','已启用','长期有效'],['操作日志','正常','今日 36 条']])}
function switchPage(i){document.querySelectorAll('.nav,.tab').forEach(x=>x.classList.toggle('active',Number(x.dataset.index)===i));document.querySelectorAll('.view').forEach((x,n)=>x.classList.toggle('active',n===i));bindActions()}
function addAccountRow(){const rows=document.getElementById('accountRows');if(!rows||rows.children.length>=20)return;const row=document.createElement('div');row.className='account-row';row.innerHTML='<input class="damai-account" autocomplete="off" placeholder="大麦账号 / 手机号"><input class="damai-password" type="password" autocomplete="new-password" placeholder="大麦密码"><button class="remove-row" type="button" aria-label="删除此账号">×</button>';rows.appendChild(row);row.querySelector('.damai-account').focus();bindActions()}
function distributeAccounts(){const error=document.getElementById('distributionError'),rows=[...document.querySelectorAll('#accountRows .account-row')],entries=rows.map(row=>({account:row.querySelector('.damai-account').value.trim(),password:row.querySelector('.damai-password').value})).filter(x=>x.account||x.password);error.textContent='';if(!entries.length){error.textContent='请至少输入一个大麦账号和密码';return}if(entries.some(x=>!x.account||!x.password)){error.textContent='每一行都需要同时填写账号和密码';return}if(new Set(entries.map(x=>x.account)).size!==entries.length){error.textContent='存在重复账号，请核对后再分配';return}const regions=['北京','上海','杭州','广州','深圳','成都','重庆'];const mapping=entries.map((entry,index)=>({device:'CM-'+String(index+1).padStart(3,'0'),region:regions[index%regions.length],account:entry.account}));rows.forEach(row=>{row.querySelector('.damai-password').value=''});showMapping(mapping)}
function showMapping(mapping){const body=document.getElementById('mappingRows');body.replaceChildren();mapping.forEach(item=>{const row=document.createElement('tr');[item.device,item.region,item.account].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell)});const status=document.createElement('td');status.className='ready';status.textContent='映射完成';row.appendChild(status);body.appendChild(row)});document.getElementById('mappingSummary').textContent='已完成 '+mapping.length+' 个账号与 '+mapping.length+' 台云机的对应分配';document.getElementById('mappingModal').classList.add('open')}
function bindActions(){const allocate=document.getElementById('allocate');if(allocate)allocate.onclick=()=>drawer.classList.add('open');document.querySelectorAll('.city').forEach(x=>x.onclick=()=>x.classList.toggle('sel'));document.querySelectorAll('.create').forEach(x=>x.onclick=notify);document.querySelectorAll('.switch').forEach(x=>x.onclick=()=>{x.classList.toggle('on');x.setAttribute('aria-checked',x.classList.contains('on')?'true':'false')});document.querySelectorAll('.save-settings').forEach(x=>x.onclick=()=>{localStorage.setItem('ticketAdminSettings',Date.now());notify()});document.querySelectorAll('.save-account').forEach(x=>x.onclick=()=>{localStorage.setItem('ticketAgentContact',JSON.stringify({name:document.getElementById('contactName')?.value||'',phone:document.getElementById('notifyPhone')?.value||''}));notify()});const refresh=document.getElementById('refreshMonitor');if(refresh)refresh.onclick=()=>{refresh.textContent='已刷新';notify();setTimeout(()=>refresh.textContent='刷新状态',1200)};const add=document.getElementById('addAccountRow');if(add)add.onclick=addAccountRow;const distribute=document.getElementById('distributeAccounts');if(distribute)distribute.onclick=distributeAccounts;document.querySelectorAll('.remove-row').forEach(x=>x.onclick=()=>{const rows=document.getElementById('accountRows');if(rows.children.length===1){x.closest('.account-row').querySelectorAll('input').forEach(input=>input.value='')}else x.closest('.account-row').remove()})}
function notify(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
side.innerHTML=pageNames.map((p,i)=>'<button class="nav '+(i?'':'active')+'" data-index="'+i+'">'+p+'</button>').join('');tabs.innerHTML=pageNames.map((p,i)=>'<button class="tab '+(i?'':'active')+'" data-index="'+i+'">'+p+'</button>').join('');views.innerHTML=pageNames.map((p,i)=>'<section class="view '+(i?'':'active')+'">'+pageHtml(p)+'</section>').join('');document.querySelectorAll('.nav,.tab').forEach(x=>x.addEventListener('click',()=>switchPage(Number(x.dataset.index))));document.getElementById('citySelect').innerHTML=cityData.map(x=>'<option>'+x[0]+'（可用 '+x[2]+'）</option>').join('');document.getElementById('closeDrawer').addEventListener('click',()=>drawer.classList.remove('open'));document.getElementById('save').addEventListener('click',()=>{drawer.classList.remove('open');notify()});document.getElementById('closeMapping').addEventListener('click',()=>document.getElementById('mappingModal').classList.remove('open'));document.getElementById('mappingModal').addEventListener('click',e=>{if(e.target.id==='mappingModal')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('mappingModal').classList.remove('open')});document.getElementById('logout').addEventListener('click',async()=>{sessionStorage.removeItem('ticket-ops-'+currentRole);location.replace(currentRole+'.html')});bindActions();
</script></body></html>
