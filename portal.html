<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d8ad5b" />
    <meta name="description" content="金境 iOS 专属入口" />
    <!-- 填入 HTTPS 接口地址后，设备信息会同时 POST 到该接口。 -->
    <meta name="device-api-url" content="" />
    <title>金境 · iOS 专属入口</title>
    <script type="module" crossorigin src="./assets/portal-BXKW9Lea.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Dezn_h7o.js">
    <link rel="stylesheet" crossorigin href="./assets/portal-BEkzps4I.css">
  </head>
  <body>
    <main class="landing">
      <section class="hero-stage" aria-label="金境">
        <div class="brand-lockup" aria-label="金境 Golden Realm">
          <span class="brand-monogram">GR</span>
          <span class="brand-copy">
            <strong>金境</strong>
            <small>GOLDEN REALM</small>
          </span>
        </div>

        <img
          class="hero-art"
          src="./assets/golden-game-hero-uY-H2clx.webp"
          alt="金色舞台上的原创兔子魔术师与奇幻伙伴"
          width="912"
          height="1640"
        />

        <span class="hero-glow" aria-hidden="true"></span>
        <span class="spark spark-one" aria-hidden="true"></span>
        <span class="spark spark-two" aria-hidden="true"></span>
        <span class="spark spark-three" aria-hidden="true"></span>
      </section>

      <section class="action-area" aria-label="快捷入口">
        <div class="action-grid">
          <button class="action-button" type="button" data-connect>
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 11.2 12 5l8 6.2V20H4v-8.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
                <path d="M9 20v-5.5h6V20" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>立即注册</span>
          </button>

          <button class="action-button action-button-primary" type="button" data-connect>
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5.5" y="2.8" width="13" height="18.4" rx="2.7" stroke="currentColor" stroke-width="1.9"/>
                <path d="M10 5.8h4M10.5 18.2h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </span>
            <span>进入游戏</span>
          </button>

          <button class="action-button" type="button" data-service="专属客服正在为您接入">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 9.5V8a7 7 0 0 1 14 0v1.5M5 9.5H3.8A1.8 1.8 0 0 0 2 11.3v3.4a1.8 1.8 0 0 0 1.8 1.8H5v-7Zm14 0h1.2a1.8 1.8 0 0 1 1.8 1.8v3.4a1.8 1.8 0 0 1-1.8 1.8H19v-7ZM19 16.5c-.7 2.3-2.8 3.5-5.3 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span>专属客服</span>
          </button>

          <button class="action-button" type="button" data-service="在线客服正在为您接入">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 11.5a8 8 0 1 1-3.1-6.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M21 5.2v5h-5M8.6 11.8h.1m3.2 0h.1m3.2 0h.1M8.5 15.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span>24H 在线客服</span>
          </button>
        </div>
      </section>

      <section class="trust-section" aria-label="服务保障">
        <div class="trust-grid">
          <div class="trust-item">
            <span class="trust-seal"><b>IOS</b><i>ONLY</i></span>
            <strong>iOS 专属入口</strong>
            <small>系统识别</small>
          </div>
          <div class="trust-item">
            <span class="trust-seal">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 5 6v5c0 4.7 2.9 8.1 7 10 4.1-1.9 7-5.3 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.6"/>
                <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <strong>数据加密</strong>
            <small>安全传输</small>
          </div>
          <div class="trust-item">
            <span class="trust-seal">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 4 7v5c0 4 2.5 7 8 9 5.5-2 8-5 8-9V7l-8-4Z" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8.5 12.2 11 14.5l4.8-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <strong>品质服务</strong>
            <small>稳定响应</small>
          </div>
          <div class="trust-item">
            <span class="trust-seal"><b>24H</b><i>LIVE</i></span>
            <strong>全天在线</strong>
            <small>及时协助</small>
          </div>
        </div>
        <p class="quality-line"><span></span>品质服务 · 用心体验 · 专属礼遇<span></span></p>
      </section>
    </main>

    <div class="consent-modal" id="consentModal" hidden>
      <button class="consent-backdrop" type="button" data-close-consent aria-label="关闭"></button>
      <section class="consent-sheet" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="consent-heading">
          <span class="consent-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="6" y="2.5" width="12" height="19" rx="3" stroke="currentColor" stroke-width="1.8"/>
              <path d="M10 5.5h4M10.5 18.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <span class="consent-kicker">iOS DEVICE ACCESS</span>
            <h2 id="consentTitle">确认设备接入</h2>
          </div>
        </div>
        <p class="consent-copy">
          继续后将读取并提交浏览器可见的 iOS 系统版本、屏幕规格、语言与访问时间。
        </p>
        <div class="device-preview">
          <div><span>设备</span><strong id="previewModel">正在识别</strong></div>
          <div><span>系统</span><strong id="previewSystem">iOS</strong></div>
        </div>
        <p class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7.5 10V8a4.5 4.5 0 0 1 9 0v2M6 10h12v10H6V10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          不读取照片、通讯录、账号信息或设备唯一标识。
        </p>
        <div class="consent-actions">
          <button class="consent-cancel" id="consentCancel" type="button">暂不</button>
          <button class="consent-confirm" id="consentConfirm" type="button">同意并继续</button>
        </div>
      </section>
    </div>

    <div class="portal-toast" id="portalToast" role="status" aria-live="polite">
      <span class="toast-check">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m6.5 12.5 3.5 3.3 7.5-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span id="portalToastText">设备信息已提交</span>
    </div>

  </body>
</html>
